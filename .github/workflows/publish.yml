name: Publish

on:
  workflow_call:

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/graphmind-core

      - run: npm ci

      - name: Build native addon
        run: |
          npx napi build --platform --release --manifest-path crates/graphmind-core/Cargo.toml --js false
          ls -la *.node 2>/dev/null || echo "No .node files in root"
          find . -name "*.node" -not -path "*/node_modules/*" 2>/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            *.node
            crates/**/*.node
          if-no-files-found: warn

  publish:
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move native binaries
        run: |
          mkdir -p src/native
          find artifacts -name "*.node" -exec cp {} src/native/ \; 2>/dev/null || true
          echo "Native binaries found:"
          ls -la src/native/ || true
          COUNT=$(find src/native -name "*.node" 2>/dev/null | wc -l)
          echo "Total .node files: $COUNT"

      - run: npm ci
      - run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
