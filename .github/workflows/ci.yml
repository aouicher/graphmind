name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # --- CI: runs on every push and PR ---

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --exclude graphmind-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude graphmind-desktop

  rust-build:
    needs: rust-check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: graphmind-aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: graphmind-x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: graphmind-x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p graphmind-cli

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/graphmind dist/${{ matrix.binary }}
          chmod +x dist/${{ matrix.binary }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  # --- Desktop app build (macOS, signed + notarized) ---

  desktop-build:
    needs: rust-check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: crates/graphmind-desktop
        run: npm ci

      - name: Install Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build Tauri app (sign + notarize)
        working-directory: crates/graphmind-desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphmind-desktop-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # --- CD: release on push to main or staging ---

  release:
    needs: [rust-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.create.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version bump
        id: version
        env:
          BRANCH_REF: ${{ github.ref }}
        run: |
          CURRENT=$(grep '^version' crates/graphmind-cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          BRANCH="${BRANCH_REF#refs/heads/}"
          if [ "$BRANCH" = "staging" ]; then
            TAG="v${CURRENT}-rc"
            PRERELEASE="true"
          else
            TAG="v${CURRENT}"
            PRERELEASE="false"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        id: create
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --generate-notes --title "$TAG" --prerelease
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"

  release-assets:
    needs: [release, rust-build, desktop-build]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload all assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # Upload CLI binaries
          for dir in artifacts/graphmind-aarch64-apple-darwin artifacts/graphmind-x86_64-apple-darwin artifacts/graphmind-x86_64-unknown-linux-gnu; do
            if [ -d "$dir" ]; then
              for file in "$dir"/*; do
                gh release upload "$TAG" "$file" --repo "$REPO" --clobber
              done
            fi
          done

          # Upload desktop DMGs
          for dir in artifacts/graphmind-desktop-*; do
            if [ -d "$dir" ]; then
              for file in "$dir"/*.dmg; do
                gh release upload "$TAG" "$file" --repo "$REPO" --clobber
              done
            fi
          done

  update-homebrew:
    needs: [release, release-assets]
    if: needs.release.outputs.released == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish binaries to homebrew-graphmind and update formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          TAP_REPO="aouicher/homebrew-graphmind"

          # Create release on homebrew-graphmind and upload binaries
          gh release create "$TAG" --repo "$TAP_REPO" --title "graphmind $TAG" --notes "graphmind $TAG binaries" 2>/dev/null || true
          for dir in artifacts/graphmind-*-*-darwin artifacts/graphmind-*-linux-*; do
            if [ -d "$dir" ]; then
              binary=$(ls "$dir")
              gh release upload "$TAG" "$dir/$binary" --repo "$TAP_REPO" --clobber
            fi
          done

          # Compute SHA256
          SHA_ARM64=$(shasum -a 256 artifacts/graphmind-aarch64-apple-darwin/graphmind-aarch64-apple-darwin | cut -d' ' -f1)
          SHA_X64=$(shasum -a 256 artifacts/graphmind-x86_64-apple-darwin/graphmind-x86_64-apple-darwin | cut -d' ' -f1)
          SHA_LINUX=$(shasum -a 256 artifacts/graphmind-x86_64-unknown-linux-gnu/graphmind-x86_64-unknown-linux-gnu | cut -d' ' -f1)

          # Generate formula pointing to homebrew-graphmind releases
          cat > /tmp/graphmind.rb << RUBY
          class Graphmind < Formula
            desc "Local-first code intelligence CLI with MCP server"
            homepage "https://github.com/aouicher/graphmind"
            license "MIT"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/${TAP_REPO}/releases/download/${TAG}/graphmind-aarch64-apple-darwin"
                sha256 "${SHA_ARM64}"
              else
                url "https://github.com/${TAP_REPO}/releases/download/${TAG}/graphmind-x86_64-apple-darwin"
                sha256 "${SHA_X64}"
              end
            end

            on_linux do
              url "https://github.com/${TAP_REPO}/releases/download/${TAG}/graphmind-x86_64-unknown-linux-gnu"
              sha256 "${SHA_LINUX}"
            end

            def install
              binary = Dir["graphmind-*"].first || "graphmind"
              bin.install binary => "graphmind"
            end

            test do
              assert_match "graphmind", shell_output("#{bin}/graphmind --help")
            end
          end
          RUBY
          sed -i 's/^          //' /tmp/graphmind.rb

          # Update formula in tap repo
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" /tmp/homebrew-graphmind
          cp /tmp/graphmind.rb /tmp/homebrew-graphmind/Formula/graphmind.rb
          cd /tmp/homebrew-graphmind
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/graphmind.rb
          git commit -m "Update graphmind to ${TAG}"
          git push
