name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # --- CI: runs on every push and PR ---

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-build:
    needs: rust-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: graphmind-aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: graphmind-x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: graphmind-x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p graphmind-cli

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/graphmind dist/${{ matrix.binary }}
          chmod +x dist/${{ matrix.binary }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  # --- CD: only on push to main, after CI passes ---

  release:
    needs: [rust-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.create.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version bump
        id: version
        run: |
          CURRENT=$(grep '^version' crates/graphmind-cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAG="v${CURRENT}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        id: create
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --generate-notes --title "$TAG"
          echo "released=true" >> "$GITHUB_OUTPUT"

  release-rust:
    needs: [release, rust-build]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          for dir in artifacts/graphmind-*; do
            binary=$(ls "$dir")
            gh release upload "$TAG" "$dir/$binary" --repo "$REPO"
          done

  update-homebrew:
    needs: [release, release-rust]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute SHA256 checksums
        id: sha
        run: |
          echo "arm64=$(shasum -a 256 artifacts/graphmind-aarch64-apple-darwin/graphmind-aarch64-apple-darwin | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "x64=$(shasum -a 256 artifacts/graphmind-x86_64-apple-darwin/graphmind-x86_64-apple-darwin | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux=$(shasum -a 256 artifacts/graphmind-x86_64-unknown-linux-gnu/graphmind-x86_64-unknown-linux-gnu | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          SHA_ARM64: ${{ steps.sha.outputs.arm64 }}
          SHA_X64: ${{ steps.sha.outputs.x64 }}
          SHA_LINUX: ${{ steps.sha.outputs.linux }}
        run: |
          VERSION="${TAG#v}"
          cat > /tmp/graphmind.rb << FORMULA
          class Graphmind < Formula
            desc "Local-first code intelligence CLI with MCP server"
            homepage "https://github.com/aouicher/graphmind"
            license "MIT"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/aouicher/graphmind/releases/download/${TAG}/graphmind-aarch64-apple-darwin"
                sha256 "${SHA_ARM64}"
              else
                url "https://github.com/aouicher/graphmind/releases/download/${TAG}/graphmind-x86_64-apple-darwin"
                sha256 "${SHA_X64}"
              end
            end

            on_linux do
              url "https://github.com/aouicher/graphmind/releases/download/${TAG}/graphmind-x86_64-unknown-linux-gnu"
              sha256 "${SHA_LINUX}"
            end

            def install
              binary = Dir["graphmind-*"].first || "graphmind"
              bin.install binary => "graphmind"
            end

            test do
              assert_match "graphmind", shell_output("#{bin}/graphmind --help")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' /tmp/graphmind.rb

          gh repo clone aouicher/homebrew-tap /tmp/homebrew-tap
          cp /tmp/graphmind.rb /tmp/homebrew-tap/Formula/graphmind.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/graphmind.rb
          git commit -m "Update graphmind to ${TAG}"
          git push
