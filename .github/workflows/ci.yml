name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude graphmind-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude graphmind-desktop --lib --bins

  e2e-setup:
    runs-on: ubuntu-latest
    needs: [rust-check]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p graphmind-cli --test setup_e2e -- --test-threads=1

  e2e-cli:
    runs-on: ubuntu-latest
    needs: [rust-check]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build debug binary
        run: cargo build -p graphmind-cli
      - name: Run CLI E2E tests (read-only suites in parallel with write suites)
        run: |
          # Read-only suites: use QueryTestEnv (pre-built shared graph, no state mutation).
          # Each cargo test binary has its own static TEST_LOCK and its own HOME via .env(),
          # so running two cargo invocations in parallel is safe.
          cargo test -p graphmind-cli \
            --test cli_query_e2e \
            --test cli_export_e2e \
            --test cli_memory_e2e \
            --test cli_memory_persistence_e2e \
            --test cli_session_e2e \
            -- --test-threads=1 &
          PID1=$!

          # Write/build suites: register, build, or mutate state.
          cargo test -p graphmind-cli \
            --test cli_build_e2e \
            --test cli_register_e2e \
            --test cli_clean_e2e \
            --test cli_exclude_e2e \
            --test cli_sync_e2e \
            --test cli_auth_e2e \
            -- --test-threads=1 &
          PID2=$!

          wait $PID1 && wait $PID2

  verify-tag-on-main:
    if: startsWith(github.ref, 'refs/tags/v') && github.ref_type == 'tag' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag points to a commit on main
        id: check
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $GITHUB_REF_NAME does not point to a commit on main — skipping release builds." >&2
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  rust-build:
    needs: [rust-check, verify-tag-on-main]
    if: needs.verify-tag-on-main.outputs.on_main == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: graphmind-aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: graphmind-x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: graphmind-x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: graphmind-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Inject version from tag (unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          perl -i -pe "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" Cargo.toml
      - name: Inject version from tag (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          (Get-Content Cargo.toml) -replace '^version = "[^"]*"', "version = `"$version`"" | Set-Content Cargo.toml
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p graphmind-cli
      - name: Package binary (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/graphmind dist/${{ matrix.binary }}
          chmod +x dist/${{ matrix.binary }}
      - name: Package binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/graphmind.exe" "dist/${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1

  desktop-build:
    needs: [rust-check, verify-tag-on-main]
    if: needs.verify-tag-on-main.outputs.on_main == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: crates/graphmind-desktop
        run: npm ci
      - name: Inject version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          perl -i -pe "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" Cargo.toml
          perl -i -pe "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" crates/graphmind-desktop/src-tauri/tauri.conf.json
      - name: Install Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
      - name: Build Tauri app (sign + notarize)
        working-directory: crates/graphmind-desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphmind-desktop-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 1
      - name: Upload updater artifact (tar.gz + sig)
        uses: actions/upload-artifact@v4
        with:
          name: graphmind-updater-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.tar.gz.sig
          if-no-files-found: warn
          retention-days: 1

  release:
    needs: [rust-check, verify-tag-on-main]
    if: needs.verify-tag-on-main.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.create.outputs.released }}
      tag: ${{ github.ref_name }}
      prerelease: ${{ steps.create.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE="false"
          if [[ "$TAG" == *"-rc"* ]]; then
            PRERELEASE="true"
            gh release create "$TAG" --generate-notes --title "$TAG" --prerelease
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  release-assets:
    needs: [release, rust-build, desktop-build]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload all assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          cp artifacts/graphmind-aarch64-apple-darwin/graphmind-aarch64-apple-darwin /tmp/graphmind-cli-macos-arm64
          cp artifacts/graphmind-x86_64-apple-darwin/graphmind-x86_64-apple-darwin /tmp/graphmind-cli-macos-x64
          cp artifacts/graphmind-x86_64-unknown-linux-gnu/graphmind-x86_64-unknown-linux-gnu /tmp/graphmind-cli-linux-x64
          cp "artifacts/graphmind-x86_64-pc-windows-msvc.exe/graphmind-x86_64-pc-windows-msvc.exe" /tmp/graphmind-cli-windows-x64.exe
          gh release upload "$TAG" /tmp/graphmind-cli-macos-arm64 --repo "$REPO" --clobber
          gh release upload "$TAG" /tmp/graphmind-cli-macos-x64 --repo "$REPO" --clobber
          gh release upload "$TAG" /tmp/graphmind-cli-linux-x64 --repo "$REPO" --clobber
          gh release upload "$TAG" /tmp/graphmind-cli-windows-x64.exe --repo "$REPO" --clobber
          for dir in artifacts/graphmind-desktop-*; do
            [ -d "$dir" ] || continue
            ARCH=$(basename "$dir" | sed 's/graphmind-desktop-//')
            LABEL=$([ "$ARCH" = "aarch64" ] && echo "arm64" || echo "x64")
            for file in "$dir"/*.dmg; do
              cp "$file" "/tmp/GraphMind-macos-${LABEL}.dmg"
              gh release upload "$TAG" "/tmp/GraphMind-macos-${LABEL}.dmg" --repo "$REPO" --clobber
            done
          done
          for dir in artifacts/graphmind-updater-*; do
            [ -d "$dir" ] || continue
            ARCH=$(basename "$dir" | sed 's/graphmind-updater-//')
            for file in "$dir"/*.tar.gz; do
              [ -f "$file" ] || continue
              DEST="/tmp/GraphMind-macos-${ARCH}.app.tar.gz"
              cp "$file" "$DEST"
              gh release upload "$TAG" "$DEST" --repo "$REPO" --clobber
            done
            for file in "$dir"/*.tar.gz.sig; do
              [ -f "$file" ] || continue
              DEST="/tmp/GraphMind-macos-${ARCH}.app.tar.gz.sig"
              cp "$file" "$DEST"
              gh release upload "$TAG" "$DEST" --repo "$REPO" --clobber
            done
          done

  verify-formula:
    needs: [release, release-assets]
    if: needs.release.outputs.released == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate and validate formula syntax
        env:
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          SHA_ARM64="placeholder"
          SHA_X64="placeholder"
          SHA_LINUX="placeholder"
          F="class Graphmind < Formula\n"
          F+="  desc \"Local-first code intelligence CLI with MCP server\"\n"
          F+="  homepage \"https://github.com/${REPO}\"\n"
          F+="  license \"MIT\"\n"
          F+="  version \"${VERSION}\"\n\n"
          F+="  on_macos do\n"
          F+="    if Hardware::CPU.arm?\n"
          F+="      url \"https://github.com/${REPO}/releases/download/${TAG}/graphmind-cli-macos-arm64\"\n"
          F+="      sha256 \"placeholder\"\n"
          F+="    else\n"
          F+="      url \"https://github.com/${REPO}/releases/download/${TAG}/graphmind-cli-macos-x64\"\n"
          F+="      sha256 \"placeholder\"\n"
          F+="    end\n"
          F+="  end\n\n"
          F+="  on_linux do\n"
          F+="    url \"https://github.com/${REPO}/releases/download/${TAG}/graphmind-cli-linux-x64\"\n"
          F+="    sha256 \"placeholder\"\n"
          F+="  end\n\n"
          F+="  def install\n"
          F+="    binary = Dir[\"graphmind-*\"].first || \"graphmind\"\n"
          F+="    bin.install binary => \"graphmind\"\n"
          F+="  end\n\n"
          F+="  test do\n"
          F+='    assert_match "graphmind", shell_output("#{bin}/graphmind --help")'
          F+="\n  end\n"
          F+="end\n"
          printf '%b' "$F" > /tmp/graphmind.rb
          ruby -c /tmp/graphmind.rb
          echo "Formula syntax OK"
          # Verify no merge conflict markers
          if grep -qE '^(<<<<<<<|=======|>>>>>>>)' /tmp/graphmind.rb; then
            echo "ERROR: merge conflict markers found in formula" >&2
            exit 1
          fi
      - name: Verify Linux binary runs
        run: |
          chmod +x artifacts/graphmind-x86_64-unknown-linux-gnu/graphmind-x86_64-unknown-linux-gnu
          artifacts/graphmind-x86_64-unknown-linux-gnu/graphmind-x86_64-unknown-linux-gnu --version
          echo "Linux binary OK"

  publish-homebrew:
    needs: [release, release-assets, verify-formula]
    if: needs.release.outputs.released == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          cp artifacts/graphmind-aarch64-apple-darwin/graphmind-aarch64-apple-darwin /tmp/graphmind-cli-macos-arm64
          cp artifacts/graphmind-x86_64-apple-darwin/graphmind-x86_64-apple-darwin /tmp/graphmind-cli-macos-x64
          cp artifacts/graphmind-x86_64-unknown-linux-gnu/graphmind-x86_64-unknown-linux-gnu /tmp/graphmind-cli-linux-x64
          SHA_ARM64=$(shasum -a 256 /tmp/graphmind-cli-macos-arm64 | cut -d' ' -f1)
          SHA_X64=$(shasum -a 256 /tmp/graphmind-cli-macos-x64 | cut -d' ' -f1)
          SHA_LINUX=$(shasum -a 256 /tmp/graphmind-cli-linux-x64 | cut -d' ' -f1)
          TAP_REPO="aouicher/homebrew-graphmind"
          FORMULA="class Graphmind < Formula\n"
          FORMULA+="  desc \"Local-first code intelligence CLI with MCP server\"\n"
          FORMULA+="  homepage \"https://github.com/${REPO}\"\n"
          FORMULA+="  license \"MIT\"\n"
          FORMULA+="  version \"${VERSION}\"\n\n"
          FORMULA+="  on_macos do\n"
          FORMULA+="    if Hardware::CPU.arm?\n"
          FORMULA+="      url \"https://github.com/${REPO}/releases/download/${TAG}/graphmind-cli-macos-arm64\"\n"
          FORMULA+="      sha256 \"${SHA_ARM64}\"\n"
          FORMULA+="    else\n"
          FORMULA+="      url \"https://github.com/${REPO}/releases/download/${TAG}/graphmind-cli-macos-x64\"\n"
          FORMULA+="      sha256 \"${SHA_X64}\"\n"
          FORMULA+="    end\n"
          FORMULA+="  end\n\n"
          FORMULA+="  on_linux do\n"
          FORMULA+="    url \"https://github.com/${REPO}/releases/download/${TAG}/graphmind-cli-linux-x64\"\n"
          FORMULA+="    sha256 \"${SHA_LINUX}\"\n"
          FORMULA+="  end\n\n"
          FORMULA+="  def install\n"
          FORMULA+="    binary = Dir[\"graphmind-*\"].first || \"graphmind\"\n"
          FORMULA+="    bin.install binary => \"graphmind\"\n"
          FORMULA+="  end\n\n"
          FORMULA+="  test do\n"
          FORMULA+='    assert_match "graphmind", shell_output("#{bin}/graphmind --help")'
          FORMULA+="\n  end\n"
          FORMULA+="end\n"
          ENCODED=$(printf '%b' "$FORMULA" | base64 -w 0)
          CURRENT_SHA=$(gh api "repos/${TAP_REPO}/contents/Formula/graphmind.rb" --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${TAP_REPO}/contents/Formula/graphmind.rb" \
              --field message="Update graphmind to ${TAG}" \
              --field content="$ENCODED" \
              --field sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/${TAP_REPO}/contents/Formula/graphmind.rb" \
              --field message="Update graphmind to ${TAG}" \
              --field content="$ENCODED"
          fi

  publish-cask:
    needs: [release, release-assets, desktop-build]
    if: needs.release.outputs.released == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          TAP_REPO="aouicher/homebrew-graphmind"
          SHA_ARM64=$(shasum -a 256 artifacts/graphmind-desktop-aarch64/*.dmg 2>/dev/null | head -1 | cut -d' ' -f1)
          SHA_X64=$(shasum -a 256 artifacts/graphmind-desktop-x86_64/*.dmg 2>/dev/null | head -1 | cut -d' ' -f1)
          CASK="cask \"graphmind\" do\n"
          CASK+="  version \"${VERSION}\"\n\n"
          CASK+="  on_arm do\n"
          CASK+="    url \"https://github.com/${REPO}/releases/download/${TAG}/GraphMind-macos-arm64.dmg\"\n"
          CASK+="    sha256 \"${SHA_ARM64}\"\n"
          CASK+="  end\n\n"
          CASK+="  on_intel do\n"
          CASK+="    url \"https://github.com/${REPO}/releases/download/${TAG}/GraphMind-macos-x64.dmg\"\n"
          CASK+="    sha256 \"${SHA_X64}\"\n"
          CASK+="  end\n\n"
          CASK+="  name \"GraphMind\"\n"
          CASK+="  desc \"Local-first code intelligence with MCP server\"\n"
          CASK+="  homepage \"https://getgraphmind.com\"\n\n"
          CASK+="  app \"GraphMind.app\"\n\n"
          CASK+="  zap trash: [\n"
          CASK+='    "~/.graphmind",'
          CASK+="\n"
          CASK+='    "~/Library/Application Support/GraphMind",'
          CASK+="\n"
          CASK+='    "~/Library/Preferences/com.graphmind.app.plist",'
          CASK+="\n"
          CASK+='    "~/Library/Caches/com.graphmind.app",'
          CASK+="\n"
          CASK+="  ]\n"
          CASK+="end\n"
          ENCODED=$(printf '%b' "$CASK" | base64 -w 0)
          CURRENT_SHA=$(gh api "repos/${TAP_REPO}/contents/Casks/graphmind.rb" --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "repos/${TAP_REPO}/contents/Casks/graphmind.rb" \
              --field message="Update GraphMind cask to ${TAG}" \
              --field content="$ENCODED" \
              --field sha="$CURRENT_SHA"
          else
            gh api --method PUT "repos/${TAP_REPO}/contents/Casks/graphmind.rb" \
              --field message="Update GraphMind cask to ${TAG}" \
              --field content="$ENCODED"
          fi

  publish-updater:
    needs: [release, release-assets, desktop-build]
    if: needs.release.outputs.released == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish latest.json for Tauri auto-updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          SIG_ARM64=""
          SIG_X64=""
          for dir in artifacts/graphmind-updater-*; do
            [ -d "$dir" ] || continue
            ARCH=$(basename "$dir" | sed 's/graphmind-updater-//')
            for file in "$dir"/*.tar.gz.sig; do
              [ -f "$file" ] || continue
              if [ "$ARCH" = "aarch64" ]; then
                SIG_ARM64=$(cat "$file")
              else
                SIG_X64=$(cat "$file")
              fi
            done
          done
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > /tmp/latest.json << JSON
          {
            "version": "${VERSION}",
            "notes": "graphmind ${TAG}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "url": "https://github.com/${REPO}/releases/download/${TAG}/GraphMind-macos-aarch64.app.tar.gz",
                "signature": "${SIG_ARM64}"
              },
              "darwin-x86_64": {
                "url": "https://github.com/${REPO}/releases/download/${TAG}/GraphMind-macos-x86_64.app.tar.gz",
                "signature": "${SIG_X64}"
              }
            }
          }
          JSON
          sed -i 's/^          //' /tmp/latest.json
          gh release upload "$TAG" /tmp/latest.json --repo "$REPO" --clobber
