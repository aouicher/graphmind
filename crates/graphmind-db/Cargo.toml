[package]
name = "graphmind-db"
version = "0.2.35"
edition = "2021"
license = "MIT"
description = "SQLite graph storage layer for graphmind"

[dependencies]
graphmind-core = { path = "../graphmind-core" }
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
walkdir = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pipeline_bench"
harness = false
