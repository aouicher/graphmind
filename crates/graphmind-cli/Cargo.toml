[package]
name = "graphmind-cli"
version = "0.2.100"
edition = "2021"
license = "MIT"
description = "Local-first code intelligence CLI"
repository = "https://github.com/aouicher/graphmind"
homepage = "https://github.com/aouicher/graphmind"
readme = "../../README.md"
keywords = ["code-intelligence", "mcp", "knowledge-graph", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "graphmind"
path = "src/main.rs"

[dependencies]
graphmind-core = { path = "../graphmind-core" }
graphmind-db = { path = "../graphmind-db" }
graphmind-memory = { path = "../graphmind-memory" }
graphmind-mcp = { path = "../graphmind-mcp" }
graphmind-config = { path = "../graphmind-config" }
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
notify = "7"
notify-debouncer-mini = "0.5"
graphmind-embeddings = { path = "../graphmind-embeddings" }
