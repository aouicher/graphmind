[package]
name = "graphmind-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local-first code intelligence CLI"

[[bin]]
name = "graphmind"
path = "src/main.rs"

[dependencies]
graphmind-core = { path = "../graphmind-core" }
graphmind-db = { path = "../graphmind-db" }
graphmind-memory = { path = "../graphmind-memory" }
graphmind-mcp = { path = "../graphmind-mcp" }
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
