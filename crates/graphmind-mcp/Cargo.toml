[package]
name = "graphmind-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server for graphmind"

[dependencies]
graphmind-db = { path = "../graphmind-db" }
graphmind-memory = { path = "../graphmind-memory" }
graphmind-embeddings = { path = "../graphmind-embeddings" }
graphmind-config = { path = "../graphmind-config" }
rmcp = { version = "1.5", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
graphmind-db = { path = "../graphmind-db" }
