[package]
name = "graphmind-memory"
version = "0.2.109"
edition = "2021"
license = "MIT"
description = "JSONL memory and cross-link stores for graphmind"

[dependencies]
graphmind-db = { path = "../graphmind-db" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
