[package]
name = "graphmind-desktop"
version = "0.2.61"
edition = "2021"
license = "MIT"
description = "GraphMind Desktop - Local-first code intelligence app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
graphmind-config = { path = "../../graphmind-config" }
graphmind-core = { path = "../../graphmind-core" }
graphmind-db = { path = "../../graphmind-db" }
graphmind-memory = { path = "../../graphmind-memory" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "7"
notify-debouncer-mini = "0.5"
chrono = "0.4"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
