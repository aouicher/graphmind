[package]
name = "graphmind-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tree-sitter based code graph extraction core for graphmind"

[lib]
crate-type = ["lib"]

[features]
default = []
napi = ["dep:napi", "dep:napi-derive"]

[dependencies]
napi = { version = "2", features = ["napi9", "serde-json"], optional = true }
napi-derive = { version = "2", optional = true }
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-ruby = "0.23"
tree-sitter-hcl = "1.1"
tree-sitter-yaml = "0.7"
tree-sitter-c = "0.23"
tree-sitter-java = "0.23"
tree-sitter-php = "0.23"
tree-sitter-bash = "0.23"
tree-sitter-css = "0.23"
tree-sitter-html = "0.23"
tree-sitter-swift = "0.6"
tree-sitter-toml-ng = "0.6"
tree-sitter-containerfile = "0.8"
tree-sitter-perl-next = "0.1"
tree-sitter-objc = "3"
tree-sitter-scss = "1"
tree-sitter-sql = { package = "tree-sitter-sequel", version = "0.3" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-dart = "0.2"
tree-sitter-r = "1.2"
tree-sitter-graphql = "0.1"
tree-sitter-scala = "0.26"
tree-sitter-powershell = "0.26"

[build-dependencies]
napi-build = "2"
