[workspace]
members = [
    "crates/graphmind-core",
    "crates/graphmind-db",
    "crates/graphmind-memory",
    "crates/graphmind-embeddings",
    "crates/graphmind-mcp",
    "crates/graphmind-config",
    "crates/graphmind-license",
    "crates/graphmind-cli",
    "crates/graphmind-desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.2.210"
edition = "2021"
license = "MIT"
repository = "https://github.com/aouicher/graphmind"
homepage = "https://github.com/aouicher/graphmind"

[workspace.metadata]
repository = "https://github.com/aouicher/graphmind"
